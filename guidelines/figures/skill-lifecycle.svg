<svg xmlns="http://www.w3.org/2000/svg" width="942" height="170" viewBox="0 0 942 170" font-family="Arial, Helvetica, sans-serif" font-size="14" role="img" aria-label="Life cycle of a team skill" xmlns:c2pa="http://c2pa.org/manifest">
<title>Life cycle of a team skill</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5F5E"/></marker></defs>
<rect width="942" height="170" fill="#FFFFFF"/>
<rect x="20" y="30" width="132" height="56" rx="6" fill="#E6E6E6" stroke="#9D9D9C" stroke-width="1.2"/>
<text x="86.0" y="48.9" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Write it and use</text>
<text x="86.0" y="67.1" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">it yourself</text>
<rect x="174" y="30" width="132" height="56" rx="6" fill="#E6E6E6" stroke="#9D9D9C" stroke-width="1.2"/>
<text x="240.0" y="48.9" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Make it generic</text>
<text x="240.0" y="67.1" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(no personal data)</text>
<path d="M152,58 L172,58" fill="none" stroke="#5F5F5E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="328" y="30" width="132" height="56" rx="6" fill="#E6E6E6" stroke="#9D9D9C" stroke-width="1.2"/>
<text x="394.0" y="48.9" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Open a</text>
<text x="394.0" y="67.1" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">merge request</text>
<path d="M306,58 L326,58" fill="none" stroke="#5F5F5E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="482" y="30" width="132" height="56" rx="6" fill="#E6E6E6" stroke="#9D9D9C" stroke-width="1.2"/>
<text x="548.0" y="48.9" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">A colleague</text>
<text x="548.0" y="67.1" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">tries it</text>
<path d="M460,58 L480,58" fill="none" stroke="#5F5F5E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="636" y="30" width="132" height="56" rx="6" fill="#E6E6E6" stroke="#9D9D9C" stroke-width="1.2"/>
<text x="702.0" y="48.9" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Merge,</text>
<text x="702.0" y="67.1" fill="#1A1A1A" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle">name an owner</text>
<path d="M614,58 L634,58" fill="none" stroke="#5F5F5E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="790" y="30" width="132" height="56" rx="6" fill="#F8C471" stroke="#F8C471" stroke-width="1.5"/>
<text x="856.0" y="48.9" fill="#1A1A1A" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Everyone copies it</text>
<text x="856.0" y="67.1" fill="#1A1A1A" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">into their skills</text>
<path d="M768,58 L788,58" fill="none" stroke="#5F5F5E" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M856.0,86 L856.0,130 L394.0,130 L394.0,88" fill="none" stroke="#5F5F5E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="428.6" y="135.2" width="392.8" height="21.6" fill="#FFFFFF"/>
<text x="625.0" y="146.0" fill="#5F5F5E" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">feedback: the owner updates it through a new merge request</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
